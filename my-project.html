<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <link rel="stylesheet" href="./CSS/my-project.css">
    <link rel="stylesheet" href="./CSS/about-me.css">  
</head>

<body class="is-loading">
    <div class="skeleton-screen" id="skeletonScreen" aria-label="Loading projects" role="status">
        <div class="skeleton-shell">
            <div class="skeleton-block skeleton-header-line"></div>
            <div class="skeleton-block skeleton-title-main"></div>
            <div class="skeleton-filter-row">
                <div class="skeleton-block skeleton-filter"></div>
                <div class="skeleton-block skeleton-filter"></div>
                <div class="skeleton-block skeleton-filter"></div>
            </div>
            <div class="skeleton-grid">
                <div class="skeleton-block skeleton-project-card"></div>
                <div class="skeleton-block skeleton-project-card"></div>
                <div class="skeleton-block skeleton-project-card"></div>
            </div>
        </div>
    </div>

    <div class="projects-wrapper">
        <div class="back-arrow">
            <div class="hover-name-back" id>Back</div>
            <p class="back-arrow-text" id="backArrowTeext">&#8592;</p>
        </div>
        <!-- Section Header -->
        <div class="section-header">
            <h2>My Projects</h2>
            <div class="header-line"></div>
        </div>

        <!-- Filter Navigation -->
        <div class="filter-nav">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Webaites</button>
            <button class="filter-btn">UI/UX</button>
            <button class="filter-btn">Dashboard</button>
            <button class="filter-btn">Landing Pages</button>
        </div>

        <!-- Projects Grid -->
        <div class="projects-grid">

            <!-- Card 1 -->
            <div class="project-card">
                <div class="card-image dark-thumb-1">
                    <img class="card-img" src="assets/project image/portfolio website.jfif" alt="Portfolio Website">
                </div>
                <div class="card-content">
                    <h3>Portfolio Website</h3>
                    <p>HTML, CSS, JS</p>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="project-card">
                <div class="card-image light-thumb">
                    <img class="card-img" src="assets/project image/e commerce website.jfif" alt="E-Commerce Website">
                </div>
                <div class="card-content">
                    <h3>E-Commercee Website</h3>
                    <p>HTML, CSS, JS</p>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="project-card">
                <div class="card-image dark-thumb-2">
                    <img class="card-img" src="assets/project image/blog website.jfif" alt="Blog Website">
                </div>
                <div class="card-content">
                    <h3>Blog Website</h3>
                    <p>HTML, CSS, JS</p>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="project-card">
                <div class="card-image dark-thumb-3">
                    <img class="card-img" src="assets/project image/dashboard ui.jfif" alt="Dashboard UI">
                </div>
                <div class="card-content">
                    <h3>Dashboard UI</h3>
                    <p>UI/UX Design</p>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="project-card">
                <div class="card-image dark-thumb-4">
                    <img class="card-img" src="assets/project image/landing page.jfif" alt="Landing Page">
                </div>
                <div class="card-content">
                    <h3>Landing Page</h3>
                    <p>HTML, CSS, JS</p>
                </div>
            </div>

            <!-- Card 6 -->
            <div class="project-card">
                <div class="card-image dark-thumb-5">
                    <img class="card-img" src="assets/project image/mobile app ui.jfif" alt="Mobile App UI">
                </div>
                <div class="card-content">
                    <h3>Mobile App UI</h3>
                    <p>UI/UX Design</p>
                </div>
            </div>

        </div>

        <!-- View All Button -->
        <div class="view-all-container">
            <button class="view-all-btn">View All Projects</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
